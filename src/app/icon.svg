<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Invoicely favicon: indigo tile (brand accent #4f46e5) + white invoice -->
  <rect width="64" height="64" rx="14" fill="#4f46e5"/>
  <!-- invoice paper -->
  <rect x="17" y="12" width="30" height="40" rx="4" fill="#ffffff"/>
  <!-- heading line -->
  <rect x="22" y="20" width="20" height="3.5" rx="1.75" fill="#4f46e5"/>
  <!-- line items -->
  <rect x="22" y="28" width="14" height="3" rx="1.5" fill="#c7d2fe"/>
  <rect x="22" y="34" width="11" height="3" rx="1.5" fill="#c7d2fe"/>
  <!-- amount / total -->
  <rect x="31" y="42" width="11" height="4.5" rx="2.25" fill="#4f46e5"/>
</svg>
